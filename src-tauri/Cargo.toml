[package]
name = "onionhoster"
version = "0.1.0"
description = "Host local websites and TCP services on Tor."
authors = ["Uzair"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "onionhoster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
