name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libevent-2.1-7 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            gpg \
            patchelf \
            libfuse2 \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@a7482c42c991702585197825bb70bc5e1a9c34b8 # v4.0.0
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.1
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous bundles
        run: rm -rf src-tauri/target/release/bundle

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          test "${package_version}" = "${tag_version}"
          test "${tauri_version}" = "${tag_version}"
          test "${cargo_version}" = "${tag_version}"
          echo "Releasing ${tag_version}"

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --verbose --bundles deb,appimage

      - name: Build portable tarball
        run: ./scripts/package-tarball.sh

      - name: Generate checksums
        run: |
          (
            cd src-tauri/target/release/bundle
            sha256sum \
              deb/*.deb \
              appimage/*.AppImage \
              tarball/*.tar.gz
          ) | sed 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          repository = os.environ["GITHUB_REPOSITORY"]
          artifacts = sorted(
              glob.glob("src-tauri/target/release/bundle/appimage/*.AppImage")
          )
          if len(artifacts) != 1:
              raise SystemExit(
                  f"Expected one AppImage updater artifact, found {artifacts}"
              )

          artifact = Path(artifacts[0])
          signature = Path(str(artifact) + ".sig")
          if not signature.exists():
              raise SystemExit(f"Missing updater signature: {signature}")

          manifest = {
              "version": version,
              "notes": f"OnionHoster {version}",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": {
                  "linux-x86_64": {
                      "signature": signature.read_text().strip(),
                      "url": (
                          f"https://github.com/{repository}/releases/download/"
                          f"{tag}/{artifact.name}"
                      ),
                  }
              },
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload packages
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.0
        with:
          name: onionhoster-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/tarball/*.tar.gz
            SHA256SUMS.txt
            latest.json
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fecc48a488e8633f7c0d9422f7b019623f9f2 # v2.2.1
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/tarball/*.tar.gz
            SHA256SUMS.txt
            latest.json