name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libevent-2.1-7 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            gpg \
            patchelf \
            libfuse2 \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous bundles
        run: rm -rf src-tauri/target/release/bundle

      - name: Verify release version
        run: bash scripts/verify-version.sh

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --verbose --bundles deb,appimage

      - name: Build portable tarball
        run: ./scripts/package-tarball.sh

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          repository = os.environ["GITHUB_REPOSITORY"]
          artifacts = sorted(
              glob.glob("src-tauri/target/release/bundle/appimage/*.AppImage")
          )
          if len(artifacts) != 1:
              raise SystemExit(
                  f"Expected one AppImage updater artifact, found {artifacts}"
              )

          artifact = Path(artifacts[0])
          signature = Path(str(artifact) + ".sig")
          if not signature.exists():
              raise SystemExit(f"Missing updater signature: {signature}")

          manifest = {
              "version": version,
              "notes": f"OnionHoster {version}",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": {
                  "linux-x86_64": {
                      "signature": signature.read_text().strip(),
                      "url": (
                          f"https://github.com/{repository}/releases/download/"
                          f"{tag}/{artifact.name}"
                      ),
                  }
              },
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: onionhoster-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/tarball/*.tar.gz
            latest.json
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: bash scripts/verify-version.sh

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/onionhoster.jks"

      - name: Build Android APK
        run: pnpm android:build --ci

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/onionhoster.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm android:sign

      - name: Remove Android signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/onionhoster.jks"

      - name: Generate Android update manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          artifact = Path(f"src-tauri/target/release/bundle/android/OnionHoster_{version}_android_arm64.apk")
          manifest = {
              "version": version,
              "date": datetime.now(timezone.utc).isoformat(),
              "body": f"OnionHoster {version} for Android",
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{artifact.name}",
              "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
          }
          Path("android-latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: onionhoster-android
          path: |
            src-tauri/target/release/bundle/android/*.apk
            android-latest.json
          if-no-files-found: error

  packages:
    name: Release assets
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: onionhoster-*
          path: release-assets
          merge-multiple: true

      - name: Collect release files
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets {} +
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Generate checksums
        run: |
          (
            cd release-assets
            sha256sum *.deb *.AppImage *.tar.gz *.apk
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: onionhoster-release
          path: release-assets/*
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
